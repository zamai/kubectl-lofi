apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: lofi
spec:
  version: v0.1.3
  shortDescription: Play lo-fi beats in your terminal while you kubectl
  homepage: https://github.com/zamai/kubectl-lofi
  caveats: |
    This plugin is macOS-only. It requires audio output support
    and uses the Oto audio library for playback.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zamai/kubectl-lofi/releases/download/v0.1.3/kubectl-lofi-v0.1.3-darwin-amd64.tar.gz
    sha256: cf07a770dff1c3567c043d8ac682410a53084ba997b8f0f16d04702bc3e7c721
    bin: kubectl-lofi
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zamai/kubectl-lofi/releases/download/v0.1.3/kubectl-lofi-v0.1.3-darwin-arm64.tar.gz
    sha256: f3118ee371aa84b85fb28279723fa289b828db5698476b415f3868cb39a4f0cb
    bin: kubectl-lofi
